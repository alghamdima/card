<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gratitude E-Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ground */
  --bg:#0A0A0C; --surface-1:#121215; --surface-2:#17171B; --surface-3:#26262E;
  /* ink */
  --txt:#F4F4F6; --txt-2:#B9B9C2; --txt-3:#8A8A95;
  /* accent — CTA and focus only */
  --accent:#F0A868; --accent-hover:#F5B67C; --accent-press:#DE9455; --accent-ink:#14100C;
  --accent-wash:rgba(240,168,104,.09); --accent-tint:rgba(240,168,104,.14);
  /* lines */
  --line:#2A2A31; --line-strong:#3A3A44;
  /* focus */
  --ring:rgba(240,168,104,.25);
  /* states */
  --danger:#FF8A7A; --danger-wash:rgba(255,138,122,.08);
  --ok:#7EE8BE; --ok-wash:rgba(126,232,190,.10);
  /* shadow */
  --shadow-card:0 22px 60px rgba(0,0,0,.65);
  --shadow-sm:0 18px 50px rgba(0,0,0,.60);
  --edge-inset:inset 0 0 0 1px rgba(255,255,255,.07);
  --shadow-ring:0 0 0 3px var(--ring);
  /* type */
  --face-latin:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --face-ar:'Tajawal',sans-serif;
  /* radius */
  --r-sm:10px; --r-md:12px; --r-lg:14px; --r-xl:16px; --r-2xl:20px; --r-pill:999px;
  --bw:1px;
  /* spacing */
  --sp-1:6px; --sp-2:8px; --sp-3:12px; --sp-4:18px; --sp-5:24px; --sp-6:30px; --sp-7:40px;
}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;background:var(--bg);font-family:var(--face-latin);display:flex;flex-direction:column;align-items:center;padding:22px 16px 44px;color:var(--txt);}
  html[dir=rtl] body{font-family:var(--face-ar);}
  .wrap{width:100%;max-width:430px;}

  /* language toggle — segmented, neutral */
  .langbar{display:flex;gap:var(--sp-1);justify-content:center;padding:4px;background:var(--surface-1);border:var(--bw) solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-5);}
  .langbtn{flex:1;min-height:38px;background:transparent;border:none;border-radius:9px;color:var(--txt-2);font:600 14px var(--face-latin);cursor:pointer;transition:background-color .15s ease,color .15s ease;}
  #lb-ar{font:700 14px var(--face-ar);}
  .langbtn.on{background:var(--surface-3);color:var(--txt);}
  .langbtn:focus-visible{outline:none;box-shadow:var(--shadow-ring);}

  .header{text-align:center;margin-bottom:var(--sp-5);}
  .header h1{font:600 25px/1.18 var(--face-latin);letter-spacing:-.02em;color:var(--txt);margin-bottom:6px;}
  .header p{font:400 15px/1.6 var(--face-latin);color:var(--txt-2);}
  html[dir=rtl] .header h1{font:700 25px/1.3 var(--face-ar);letter-spacing:0;}
  html[dir=rtl] .header p{font:400 15px/1.7 var(--face-ar);}

  .step-label{font:600 12px var(--face-latin);color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin:var(--sp-4) 0 13px;}
  html[dir=rtl] .step-label{font:700 13px var(--face-ar);text-transform:none;letter-spacing:0;}

  /* design picker */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
  .thumb{padding:var(--sp-1);border:var(--bw) solid var(--line);border-radius:var(--r-xl);background:var(--surface-1);cursor:pointer;transition:border-color .15s ease,background-color .15s ease;}
  .thumb .art{border-radius:11px;overflow:hidden;box-shadow:var(--edge-inset);}
  .thumb img{width:100%;display:block;}
  .thumb .nm{padding:9px 4px 3px;font:600 12px var(--face-latin);color:var(--txt-2);text-align:center;}
  html[dir=rtl] .thumb .nm{font:700 12px var(--face-ar);}
  @media (hover:hover){.thumb:hover{border-color:var(--line-strong);background:var(--surface-2);}}
  .thumb.on{border-color:var(--accent);background:var(--surface-2);}
  .thumb.on .nm{color:var(--txt);}
  .thumb:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--shadow-ring);}
  .grid-empty{grid-column:1/-1;color:var(--txt-3);font:400 14px var(--face-latin);text-align:center;padding:14px;}

  /* fields */
  label{display:block;font:600 13px var(--face-latin);color:var(--txt-2);margin-bottom:7px;}
  html[dir=rtl] label{font:700 13px var(--face-ar);}
  .opt{font-weight:400;color:var(--txt-3);}
  input[type=text],textarea{width:100%;background:var(--surface-1);border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:14px 16px;color:var(--txt);font:400 16px/1.6 var(--face-latin);outline:none;-webkit-appearance:none;resize:vertical;transition:border-color .15s ease,box-shadow .15s ease;}
  html[dir=rtl] input[type=text],html[dir=rtl] textarea{font:400 16px/1.7 var(--face-ar);}
  ::placeholder{color:var(--txt-3);opacity:1;}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--shadow-ring);}
  textarea{min-height:96px;}
  .field{margin-bottom:var(--sp-4);}

  /* presets */
  .presets{display:flex;flex-direction:column;gap:var(--sp-2);margin-bottom:11px;}
  .preset{background:var(--surface-1);border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:var(--sp-3) 14px;cursor:pointer;text-align:start;font-family:inherit;transition:border-color .15s ease,background-color .15s ease;}
  .preset .t{font:600 13px/1.25 var(--face-latin);color:var(--txt);margin-bottom:3px;}
  .preset .d{font:400 13px/1.55 var(--face-latin);color:var(--txt-2);}
  html[dir=rtl] .preset .t{font:700 14px/1.4 var(--face-ar);}
  html[dir=rtl] .preset .d{font:400 13px/1.7 var(--face-ar);}
  @media (hover:hover){.preset:hover{border-color:var(--line-strong);}}
  .preset.on{border-color:var(--accent);background:var(--accent-wash);}
  .preset:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--shadow-ring);}

  /* buttons */
  .btn{width:100%;min-height:54px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-lg);font:700 15px var(--face-latin);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:6px;transition:background-color .12s ease,transform .06s ease;}
  html[dir=rtl] .btn{font:800 15px var(--face-ar);}
  @media (hover:hover){.btn:hover{background:var(--accent-hover);}}
  .btn:active{background:var(--accent-press);transform:translateY(1px);}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);}
  .btn-ghost{width:100%;min-height:52px;background:transparent;color:var(--txt);border:var(--bw) solid var(--line-strong);border-radius:var(--r-lg);font:600 15px var(--face-latin);cursor:pointer;}
  html[dir=rtl] .btn-ghost{font:700 15px var(--face-ar);}
  @media (hover:hover){.btn-ghost:hover{background:var(--surface-1);}}

  /* result */
  #cardCanvas{display:none;}
  #resultImg{width:100%;display:block;border-radius:var(--r-md);}
  .matte{padding:10px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow-card);}
  .matte .art{border-radius:var(--r-md);overflow:hidden;box-shadow:var(--edge-inset);}
  .hintbox{background:var(--surface-1);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:16px;margin:var(--sp-4) 0;}
  .hintbox strong{display:block;margin-bottom:10px;font:600 13px var(--face-latin);color:var(--txt);}
  html[dir=rtl] .hintbox strong{font:700 14px var(--face-ar);}
  .hintbox .s{background:none;padding:0;margin-top:6px;font:400 14px/1.65 var(--face-latin);color:var(--txt-2);}
  html[dir=rtl] .hintbox .s{font:400 14px/1.8 var(--face-ar);}
  .hintbox .s b{color:var(--txt);font-weight:600;}

  /* loading / closed / blocked */
  #loadingBox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--txt-3);font:400 14px var(--face-latin);}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #closedBox{display:none;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:50px 20px;}
  #closedBox .big{color:var(--txt-3);line-height:0;}
  #closedBox h2{font:600 21px var(--face-latin);color:var(--txt);}
  #closedBox p{font:400 15px/1.7 var(--face-latin);color:var(--txt-2);}
  html[dir=rtl] #closedBox h2{font:700 21px var(--face-ar);}
  html[dir=rtl] #closedBox p{font:400 15px/1.9 var(--face-ar);}
  #blockScreen{display:none;position:fixed;inset:0;z-index:99999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;gap:18px;}
  .bs-icon{color:var(--txt-3);line-height:0;}
  .bs-title{font:600 24px var(--face-latin);color:var(--txt);}
  .bs-text{font:400 15px/1.65 var(--face-latin);color:var(--txt-2);max-width:300px;}
  .bs-text b{color:var(--txt);font-weight:600;}
  .bs-btn{max-width:300px;}
  .err{color:var(--danger);text-align:center;font:400 14px var(--face-latin);padding:20px;}

  #dl{display:block;text-decoration:none;}
  #formView,#resultView{display:none;}
  #formView.on,#resultView.on{display:block;}
</style>
</head>
<body>

<div id="blockScreen">
  <div class="bs-icon"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 0 0 18a14 14 0 0 0 0-18"/></svg></div>
  <h2 class="bs-title">Open in your browser</h2>
  <p class="bs-text">This page must be opened in <b>Safari</b> or <b>Chrome</b><br>to create and save your card.</p>
  <button class="btn bs-btn" onclick="tryOpenBrowser()">Open in Browser</button>
</div>

<div class="wrap">
  <div class="langbar" id="langbar" style="display:none">
    <button class="langbtn on" id="lb-en" onclick="setLang('en')">English</button>
    <button class="langbtn" id="lb-ar" onclick="setLang('ar')">&#x0627;&#x0644;&#x0639;&#x0631;&#x0628;&#x064A;&#x0629;</button>
  </div>

  <div class="header" id="pageHeader" style="display:none">
    <h1 id="pageTitle"></h1>
    <p id="pageSub"></p>
  </div>

  <div id="loadingBox"><div class="spin"></div><p>Loading...</p></div>

  <div id="closedBox">
    <div class="big"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/></svg></div>
    <h2 id="closedTitle">Coming Soon</h2>
    <p id="closedMsg"></p>
  </div>

  <div id="formView">
    <canvas id="cardCanvas" width="1080" height="1350"></canvas>

    <div id="designSection">
      <div class="step-label" id="lblChoose">Choose a card</div>
      <div class="grid" id="designGrid"></div>
    </div>

    <div class="step-label" id="lblDetails">Your message</div>

    <div class="field">
      <label id="lblTo">To</label>
      <input type="text" id="toInput" maxlength="40" />
    </div>

    <div class="field">
      <label id="lblMsg">Message</label>
      <div class="presets" id="presetList"></div>
      <textarea id="msgInput" rows="3" maxlength="300"></textarea>
    </div>

    <div class="field">
      <label id="lblFrom">From <span class="opt" id="lblFromOpt">(optional)</span></label>
      <input type="text" id="fromInput" maxlength="40" />
    </div>

    <button class="btn" onclick="generateCard()" id="btnGen">Create My Card</button>
  </div>

  <div id="resultView">
    <div class="matte"><div class="art"><img id="resultImg" alt="" /></div></div>
    <div class="hintbox">
      <strong id="lblSave">How to save your card</strong>
      <div class="s" id="lblIos"></div>
      <div class="s" id="lblAnd"></div>
    </div>
    <a id="dl" style="width:100%;display:none"><button class="btn" id="btnDl">Download</button></a>
    <button class="btn-ghost" style="margin-top:10px" onclick="goBack()" id="btnBack">Make another card</button>
  </div>
</div>

<script src="render.js"></script>
<script src="fonts.js"></script>
<script>
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
var LANG='en', CFG=null, DESIGNS=[], SELECTED=null, DESIGN_CACHE={}, tplImg=new Image(), imgReady=false, fontsReady=false;

var T={
  en:{choose:'Choose a card',details:'Your message',to:'To',msg:'Message',from:'From',opt:'(optional)',
      gen:'Create My Card',back:'Make another card',dl:'Download Card',save:'How to save your card',
      ios:'<b>iPhone:</b> Press &amp; hold the image above, then tap <b>"Add to Photos"</b>',
      and:'<b>Android:</b> Tap the download button below',
      toPh:'Colleague\u2019s name',msgPh:'Write your own message, or pick one above',fromPh:'Your name \u2014 leave blank to stay anonymous',
      needTo:'Please enter who this card is for.',needMsg:'Please write or choose a message.',wait:'Still loading, please try again in a moment.'},
  ar:{choose:'\u0627\u062E\u062A\u0631 \u0628\u0637\u0627\u0642\u0629',details:'\u0631\u0633\u0627\u0644\u062A\u0643',to:'\u0625\u0644\u0649',msg:'\u0627\u0644\u0631\u0633\u0627\u0644\u0629',from:'\u0645\u0646',opt:'(\u0627\u062E\u062A\u064A\u0627\u0631\u064A)',
      gen:'\u0623\u0646\u0634\u0626 \u0627\u0644\u0628\u0637\u0627\u0642\u0629',back:'\u0625\u0646\u0634\u0627\u0621 \u0628\u0637\u0627\u0642\u0629 \u0623\u062E\u0631\u0649',dl:'\u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u0628\u0637\u0627\u0642\u0629',save:'\u0643\u064A\u0641 \u062A\u062D\u0641\u0638 \u0628\u0637\u0627\u0642\u062A\u0643',
      ios:'<b>\u0622\u064A\u0641\u0648\u0646:</b> \u0627\u0636\u063A\u0637 \u0645\u0637\u0648\u0644\u0627\u064B \u0639\u0644\u0649 \u0627\u0644\u0635\u0648\u0631\u0629 \u062B\u0645 \u0627\u062E\u062A\u0631 <b>\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0635\u0648\u0631</b>',
      and:'<b>\u0623\u0646\u062F\u0631\u0648\u064A\u062F:</b> \u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0632\u0631 \u0627\u0644\u062A\u062D\u0645\u064A\u0644 \u0628\u0627\u0644\u0623\u0633\u0641\u0644',
      toPh:'\u0627\u0633\u0645 \u0627\u0644\u0632\u0645\u064A\u0644',msgPh:'\u0627\u0643\u062A\u0628 \u0631\u0633\u0627\u0644\u062A\u0643 \u0623\u0648 \u0627\u062E\u062A\u0631 \u0648\u0627\u062D\u062F\u0629 \u0645\u0645\u0627 \u0633\u0628\u0642',fromPh:'\u0627\u0633\u0645\u0643 \u2014 \u0627\u062A\u0631\u0643\u0647 \u0641\u0627\u0631\u063A\u0627\u064B \u0644\u0644\u0625\u0631\u0633\u0627\u0644 \u062F\u0648\u0646 \u0627\u0633\u0645',
      needTo:'\u0627\u0644\u0631\u062C\u0627\u0621 \u0643\u062A\u0627\u0628\u0629 \u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062A\u0644\u0645.',needMsg:'\u0627\u0644\u0631\u062C\u0627\u0621 \u0643\u062A\u0627\u0628\u0629 \u0623\u0648 \u0627\u062E\u062A\u064A\u0627\u0631 \u0631\u0633\u0627\u0644\u0629.',wait:'\u062C\u0627\u0631\u064D \u0627\u0644\u062A\u062D\u0645\u064A\u0644\u060C \u062D\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062E\u0631\u0649.'}
};

if(window.loadPreviewFonts) window.loadPreviewFonts().then(function(){fontsReady=true;});
else fontsReady=true;

function isInAppBrowser(){
  var ua=navigator.userAgent||'';
  return /OracleMobileApp|Oracle|FBAN|FBAV|Instagram|LinkedInApp|MicroMessenger|GSA/.test(ua)||(/wv/.test(ua)&&/Android/.test(ua))||(/AppleWebKit/.test(ua)&&!/Safari/.test(ua));
}
function tryOpenBrowser(){
  var url=window.location.href;
  if(isIOS){
    window.location.href='x-web-search://?q='+encodeURIComponent(url);
    setTimeout(function(){if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){alert('Link copied. Open it in Safari.');});}else{alert('Open in Safari:\n\n'+url);}},500);
  }else{
    window.location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';
    setTimeout(function(){window.open(url,'_system');},500);
  }
}

async function api(p){
  var r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  return r.json();
}

function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='ar'?'rtl':'ltr');
  document.getElementById('lb-en').className='langbtn'+(l==='en'?' on':'');
  document.getElementById('lb-ar').className='langbtn'+(l==='ar'?' on':'');
  applyText();
  renderDesigns();
  renderPresets();
}

function applyText(){
  var t=T[LANG], x=CFG&&CFG.text||{};
  var title=(LANG==='ar'?x.titleAr:x.titleEn)||'';
  var sub=(LANG==='ar'?x.subtitleAr:x.subtitleEn)||'';
  var hdr=document.getElementById('pageHeader'), any=false;
  if(title){document.getElementById('pageTitle').textContent=title;document.getElementById('pageTitle').style.display='';any=true;}
  else document.getElementById('pageTitle').style.display='none';
  if(sub){document.getElementById('pageSub').textContent=sub;document.getElementById('pageSub').style.display='';any=true;}
  else document.getElementById('pageSub').style.display='none';
  hdr.style.display=any?'block':'none';

  document.getElementById('lblChoose').textContent=t.choose;
  document.getElementById('lblDetails').textContent=t.details;
  document.getElementById('lblTo').textContent=t.to;
  document.getElementById('lblMsg').textContent=t.msg;
  document.getElementById('lblFrom').innerHTML=t.from+' <span class="opt">'+t.opt+'</span>';
  document.getElementById('toInput').placeholder=t.toPh;
  document.getElementById('msgInput').placeholder=t.msgPh;
  document.getElementById('fromInput').placeholder=t.fromPh;
  document.getElementById('btnGen').textContent=t.gen;
  document.getElementById('btnBack').textContent=t.back;
  document.getElementById('btnDl').textContent=t.dl;
  document.getElementById('lblSave').textContent=t.save;
  document.getElementById('lblIos').innerHTML=t.ios;
  document.getElementById('lblAnd').innerHTML=t.and;
}

function renderDesigns(){
  var list=DESIGNS.filter(function(d){return d.lang===LANG;});
  var g=document.getElementById('designGrid');
  document.getElementById('designSection').style.display=list.length>1?'block':'none';
  g.innerHTML=list.map(function(d){
    return '<div class="thumb'+(SELECTED===d.id?' on':'')+'" onclick="pickDesign(\''+d.id+'\')">'+
      (d.thumb?'<div class="art"><img src="data:image/jpeg;base64,'+d.thumb+'" alt=""></div>':'')+
      '<div class="nm">'+(d.name||'')+'</div></div>';
  }).join('');
  if(!list.length){ g.innerHTML='<div class="grid-empty">No cards available for this language yet.</div>'; }
  else if(!list.some(function(d){return d.id===SELECTED;})) pickDesign(list[0].id);
}

function renderPresets(){
  var arr=(CFG&&CFG.presets&&CFG.presets[LANG])||[];
  document.getElementById('presetList').innerHTML=arr.map(function(p,i){
    return '<div class="preset" id="ps'+i+'" onclick="usePreset('+i+')">'+
      '<div class="t">'+(p.icon||'')+' '+(p.label||'')+'</div>'+
      '<div class="d">'+(p.text||'')+'</div></div>';
  }).join('');
}

function usePreset(i){
  var arr=(CFG&&CFG.presets&&CFG.presets[LANG])||[];
  if(!arr[i]) return;
  document.getElementById('msgInput').value=arr[i].text||'';
  arr.forEach(function(_,j){ var el=document.getElementById('ps'+j); if(el) el.className='preset'+(i===j?' on':''); });
}

async function pickDesign(id){
  SELECTED=id;
  renderDesigns();
  imgReady=false;
  if(DESIGN_CACHE[id]){ applyDesign(DESIGN_CACHE[id]); return; }
  var d=await api({action:'getDesign',id:id});
  if(d.error) return;
  DESIGN_CACHE[id]=d;
  applyDesign(d);
}

function applyDesign(d){
  tplImg=new Image();
  tplImg.onload=function(){imgReady=true;};
  tplImg.src='data:image/jpeg;base64,'+d.image;
}

async function init(){
  if(isInAppBrowser()){
    document.getElementById('loadingBox').style.display='none';
    document.getElementById('blockScreen').style.display='flex';
    return;
  }
  try{
    var d=await api({action:'getPublicConfig'});
    CFG=d;
    document.getElementById('loadingBox').style.display='none';
    document.getElementById('langbar').style.display='flex';
    if(d.status!=='open'){
      applyText();
      var x=d.text||{};
      document.getElementById('closedTitle').textContent=(LANG==='ar'?x.closedTitleAr:x.closedTitleEn)||'Coming Soon';
      document.getElementById('closedMsg').textContent=(LANG==='ar'?x.closedMsgAr:x.closedMsgEn)||'';
      document.getElementById('closedBox').style.display='flex';
      document.getElementById('pageHeader').style.display='none';
      return;
    }
    DESIGNS=d.designs||[];
    setLang('en');
    document.getElementById('formView').classList.add('on');
  }catch(e){
    document.getElementById('loadingBox').innerHTML='<p class="err">Could not load. Please refresh.</p>';
  }
}
init();

function generateCard(){
  var t=T[LANG];
  var to=document.getElementById('toInput').value.trim();
  var msg=document.getElementById('msgInput').value.trim();
  var from=document.getElementById('fromInput').value.trim();
  if(!to){alert(t.needTo);return;}
  if(!msg){alert(t.needMsg);return;}
  if(!fontsReady||!imgReady||!SELECTED){alert(t.wait);return;}

  var d=DESIGN_CACHE[SELECTED];
  var canvas=document.getElementById('cardCanvas');
  CardRender.render(canvas,tplImg,d.boxes,{to:to,message:msg,from:from});

  var url=canvas.toDataURL('image/png');
  document.getElementById('resultImg').src=url;
  var a=document.getElementById('dl');
  a.href=url;
  a.download='gratitude-card.png';
  a.style.display=isIOS?'none':'block';

  document.getElementById('formView').classList.remove('on');
  document.getElementById('resultView').classList.add('on');
  document.getElementById('pageHeader').style.display='none';
  document.getElementById('langbar').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});

  api({action:'saveCard',to:to,message:msg,from:from,lang:LANG,designId:SELECTED,device:isIOS?'iPhone':'Android'});
}

function goBack(){
  document.getElementById('resultView').classList.remove('on');
  document.getElementById('formView').classList.add('on');
  document.getElementById('langbar').style.display='flex';
  applyText();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
