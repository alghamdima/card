# Shared reverse-proxy settings for the Go API (included from nginx.conf).
# Docker's embedded DNS + a variable makes nginx re-resolve "api" instead of caching its IP forever,
# so restarting the API container does not leave nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8080;
proxy_pass $api_upstream;

proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwritten (not appended) so clients cannot spoof the address the API rate-limits on.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
