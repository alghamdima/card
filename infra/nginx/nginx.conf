user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    # Use the scheme forwarded by an upstream TLS terminator when there is one, otherwise our own.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Defense in depth: the Go API rate-limits as well, but rejecting abusive clients here is cheaper.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Small by default (card submissions, login). Artwork uploads get a larger limit below.
        client_max_body_size 100k;

        include /etc/nginx/security-headers.conf;

        # Login: strict per-client throttle before the request reaches the API.
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        # Campaign create/update carry base64 artwork (keep in sync with the API's body limit).
        location ~ ^/api/v1/admin/campaigns(/[^/]+)?$ {
            client_max_body_size 32m;
            include /etc/nginx/proxy-api.conf;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy-api.conf;
        }

        # Friendly URL rewrite for legacy /c/:slug -> /cards/:slug
        location ~ ^/c/(?<slug>[^/]+)$ {
            return 301 /cards/$slug;
        }

        # Hashed build assets never change: cache them for a year.
        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Optional brand fonts and images: cache, but allow replacement.
        location ~ ^/(fonts|images)/ {
            add_header Cache-Control "public, max-age=604800";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # The SPA shell must always be revalidated so a new deployment is picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }

        # SvelteKit SPA fallback: route all other requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
