# Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build   (or: make up)
services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: cards-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_PATH: /data/cards.db
      MIGRATIONS_PATH: /app/migrations
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      # No defaults on purpose: the API refuses to start with the well-known development credentials.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (32+ random characters)}
      # The API is only reachable through nginx, which overwrites X-Real-IP, so it is safe to trust it for rate limiting.
      TRUST_PROXY: "true"
      # CORS stays off unless the SPA is served from a different origin.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    volumes:
      - db_data:/data
    networks:
      - cards_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: cards-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cards_internal

volumes:
  db_data:
    name: cards_db_data
    driver: local

networks:
  cards_internal:
    name: cards_internal_net
    driver: bridge
