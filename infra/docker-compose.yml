services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: cards-api
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/cards.db
      - MIGRATIONS_PATH=/app/migrations
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-cards-secret-production-2026-secure}
      - APP_ENV=production
      - TRUSTED_ORIGINS=*
    volumes:
      - db_data:/data
    networks:
      - cards_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: cards-web:latest
    container_name: cards-web-builder

  nginx:
    image: nginx:1.27-alpine
    container_name: cards-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/build:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cards_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db_data:
    name: cards_db_data
    driver: local

networks:
  cards_internal:
    name: cards_internal_net
    driver: bridge
