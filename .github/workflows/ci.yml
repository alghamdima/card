name: CI Checks & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Test Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Go Format Check
        run: |
          cd apps/api
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run Tests
        run: |
          cd apps/api
          go test -race -count=1 ./...

  build-web:
    name: Build SvelteKit Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Svelte Check & Type-check
        run: |
          cd apps/web
          npm run check

      - name: i18n key parity (ar / en)
        run: |
          cd apps/web
          npm run check:i18n

      - name: Build Web Static Output
        run: |
          cd apps/web
          npm run build

  docker:
    name: Docker images & compose config
    runs-on: ubuntu-latest
    needs: [test-api, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose file
        run: |
          ADMIN_PASSWORD=ci-password SESSION_SECRET=ci-secret-ci-secret-ci-secret-1234 \
            docker compose config --quiet

      - name: Build API image
        run: docker build -t cards-api:ci apps/api
